<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <!--
    Hitori background — apartment block at dusk.
    Bands are flat fills; atmospheric perspective does the depth (far band is
    LIGHTER than near, because there is more night air between you and it).
    Never add gradients here: they band badly on OLED.

    Sky is the page background (#16192B) showing through — no sky rect.

    Windows all carry class="win" and are ordered far -> near in document
    order. Script picks them off in reverse (nearest first) as the player
    shades cells. Each window's lit opacity lives in data-lit so a fade can
    return to exactly the right value on undo.
  -->

  <circle cx="292" cy="34" r="15" fill="#EFE3CA" opacity="0.16"/>

  <g id="band-far" fill="#1E2238">
    <rect x="0" y="86" width="38" height="114"/>
    <rect x="42" y="74" width="26" height="126"/>
    <rect x="72" y="94" width="44" height="106"/>
    <rect x="120" y="80" width="30" height="120"/>
    <rect x="154" y="90" width="52" height="110"/>
    <rect x="210" y="76" width="28" height="124"/>
    <rect x="242" y="96" width="40" height="104"/>
    <rect x="286" y="82" width="34" height="118"/>
    <rect x="324" y="92" width="36" height="108"/>
  </g>
  <g id="win-far" fill="#E9A94A">
    <rect class="win" data-lit="0.30" x="8"   y="94"  width="3" height="4" opacity="0.30"/>
    <rect class="win" data-lit="0.20" x="26"  y="102" width="3" height="4" opacity="0.20"/>
    <rect class="win" data-lit="0.35" x="50"  y="84"  width="3" height="4" opacity="0.35"/>
    <rect class="win" data-lit="0.25" x="128" y="90"  width="3" height="4" opacity="0.25"/>
    <rect class="win" data-lit="0.30" x="168" y="100" width="3" height="4" opacity="0.30"/>
    <rect class="win" data-lit="0.20" x="218" y="86"  width="3" height="4" opacity="0.20"/>
    <rect class="win" data-lit="0.28" x="296" y="92"  width="3" height="4" opacity="0.28"/>
    <rect class="win" data-lit="0.22" x="334" y="102" width="3" height="4" opacity="0.22"/>
  </g>

  <g id="band-mid" fill="#191C2E">
    <rect x="10" y="118" width="44" height="82"/>
    <rect x="58" y="130" width="32" height="70"/>
    <rect x="94" y="112" width="50" height="88"/>
    <rect x="148" y="126" width="36" height="74"/>
    <rect x="188" y="116" width="46" height="84"/>
    <rect x="238" y="132" width="30" height="68"/>
