    <rect class="win" data-lit="0.45" x="70"  y="158" width="5" height="6" opacity="0.45"/>
    <rect class="win" data-lit="0.65" x="86"  y="158" width="5" height="6" opacity="0.65"/>
    <rect class="win" data-lit="0.20" x="70"  y="176" width="5" height="6" opacity="0.20"/>
