    </div>

    <!-- COLD-START SPLASH: HITORI solves itself (the final I dims out) once per launch. -->
    <div id="splash" class="splash">
      <div class="splash-row">
        <span class="splash-cell">H</span>
        <span class="splash-cell">I</span>
        <span class="splash-cell">T</span>
        <span class="splash-cell">O</span>
        <span class="splash-cell">R</span>
        <span class="splash-cell" id="splash-last">I</span>
      </div>
    </div>

    <!-- HOME SCREEN: Continue, Daily, Learn (first run), Levels, Free play, footer.
         Every screen is a section.screen with id "screen-<name>" (see showScreen). -->
    <section id="screen-home" class="screen screen--scroll screen--active">
      <div class="home-inner">
        <div class="wordmark" aria-label="Hitori">
          <span class="wm-letters">HITOR</span><span class="wm-cell">I</span>
        </div>
        <div id="home-list" class="home-list"></div>
      </div>
    </section>

    <!-- PLACEHOLDER for screens that later tasks build (Levels, Daily, Stats, How to play). -->
    <section id="screen-soon" class="screen">
      <header class="topbar">
        <button class="back-link soon-back">‹ Home</button>
      </header>
      <div class="soon-body">
        <h2 class="soon-title">Coming soon</h2>
        <p class="soon-text">This part of the game arrives in a later update.</p>
      </div>
    </section>

    <!-- PLAY SCREEN (layout v2): HUD, sub-row, board centred in the flexible middle,
         fixed-height hint box, thumb row. sizeBoard() fits the board to .board-zone. -->
    <section id="screen-play" class="screen">
      <header class="hud">
        <button class="back-link hud-home">‹ Home</button>
        <span class="hud-tier">Crowded</span>
        <span class="hud-timer">0:00</span>
        <button class="hud-menu" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
      </header>
      <div class="hud-sub">
        <span class="hud-sub-left"><span class="hud-size">5×5</span><span class="hud-stars"></span></span>
        <span class="hud-moves">moves 0</span>
      </div>

      <div class="board-zone">
        <div id="board" class="board"></div>
      </div>

      <!-- Fixed height so the board never jumps. Idle: the three rules. A staged hint or
           a walk-through step replaces them (#hint-toast, filled by renderHint). -->
      <div class="hint-box" id="hint-box">
        <ul class="hint-rules" aria-label="The rules">
          <li>No number repeats among the lit cells of a row or column</li>
          <li>Shaded cells never touch side by side</li>
          <li>All lit cells stay connected</li>
        </ul>
        <div class="hint-toast" id="hint-toast" aria-live="polite"></div>
      </div>

      <div class="controls controls-play">
        <button class="btn btn--secondary btn-undo">Undo</button>
        <button class="btn btn--secondary btn-hint">Hint</button>
        <button class="btn btn--secondary btn-walk">Walk</button>
        <button class="btn btn--secondary btn-pause">Pause</button>
      </div>
      <!-- The walk-through's own thumb row; replaces the one above while it is open. -->
      <div class="controls controls-walk">
        <button class="btn btn--secondary walk-back">‹ Back</button>
        <button class="btn btn--secondary walk-next">Next ›</button>
        <button class="btn btn--secondary walk-close">Close</button>
        <button class="btn btn--secondary btn-pause walk-pause">Pause</button>
      </div>
    </section>

    <!-- MENU (settings + actions) -->
    <div id="menu-overlay" class="overlay">
      <div class="sheet">
        <div class="sheet-head">
          <span class="sheet-title">Menu</span>
          <button class="menu-close sheet-x" aria-label="Close">✕</button>
        </div>
        <div class="menu-stats"></div>
        <div class="sheet-actions">
          <button class="btn btn--secondary menu-restart">Restart</button>
          <button class="btn btn--secondary menu-new">New puzzle</button>
          <button class="btn btn--secondary menu-quit">Quit to menu</button>
        </div>
        <!-- same rows as the home Settings sheet (renderSettingsRows) -->
        <div class="settings" id="menu-settings"></div>
      </div>
    </div>

    <!-- SHEET OVERLAY: Rules, Settings, and later modals (showOverlay / hideOverlay). -->
    <div id="overlay" class="overlay" role="dialog" aria-modal="true">
      <div class="sheet" id="overlay-panel"></div>
    </div>

    <!-- WIN -->
    <div id="win-overlay" class="overlay">
      <div class="win-panel">
        <div class="win-tier">Crowded</div>
        <div class="win-label">solved</div>
        <div class="win-time">0:00</div>
        <div class="win-extra"></div>
        <div class="win-actions">
          <button class="btn btn--primary win-again">Play again</button>
          <button class="btn btn--secondary win-share">Share</button>
          <button class="btn btn--secondary win-menu">Menu</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Plain <script> tags share one top-level scope: load in dependency order, and
       never re-declare a name another file already declares (see js/board.js). -->
  <script src="js/rules.js"></script>
  <script src="js/board.js"></script>
  <script src="js/solver.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/explain.js"></script>
  <script src="js/hints.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/daily.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
