<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- viewport-fit=cover + safe-area padding for notch/home indicator; no zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

  <!-- iOS home-screen web app (iOS doesn't fully honor manifest.json). -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hitori">
  <meta name="theme-color" content="#16192B">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.json">

  <title>Hitori</title>

  <!-- IBM Plex Mono only — weights 300 / 400 / 500. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">

    </div>

    <!-- COLD-START SPLASH: HITORI solves itself (the final I dims out) once per launch. -->
    <div id="splash" class="splash">
      <div class="splash-row">
        <span class="splash-cell">H</span>
        <span class="splash-cell">I</span>
        <span class="splash-cell">T</span>
        <span class="splash-cell">O</span>
        <span class="splash-cell">R</span>
        <span class="splash-cell" id="splash-last">I</span>
      </div>
    </div>

    <!-- START SCREEN -->
    <section id="screen-start" class="screen screen--active">
      <div class="start-inner">
        <div class="wordmark" aria-label="Hitori">
          <span class="wm-letters">HITOR</span><span class="wm-cell">I</span>
        </div>
        <div id="tier-list" class="tier-list"></div>
      </div>
    </section>

    <!-- PLAY SCREEN -->
    <section id="screen-play" class="screen">
      <header class="hud">
        <div class="hud-left">
          <span class="hud-tier">Crowded</span>
          <span class="hud-size">5×5</span>
        </div>
        <div class="hud-right">
          <span class="hud-timer">0:00</span>
          <button class="hud-menu" aria-label="Menu">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </button>
        </div>
      </header>

      <div class="board-wrap">
        <div id="board" class="board"></div>
      </div>

      <div class="hint-toast" id="hint-toast" aria-live="polite"></div>

      <div class="controls">
        <button class="btn btn--secondary btn-undo">Undo</button>
        <button class="btn btn--secondary btn-hint">Hint</button>
      </div>
    </section>

    <!-- MENU (settings + actions) -->
    <div id="menu-overlay" class="overlay">
      <div class="sheet">
        <div class="sheet-head">
          <span class="sheet-title">Menu</span>
          <button class="menu-close sheet-x" aria-label="Close">✕</button>
        </div>
        <div class="menu-stats"></div>
        <div class="sheet-actions">
          <button class="btn btn--secondary menu-restart">Restart</button>
          <button class="btn btn--secondary menu-new">New puzzle</button>
          <button class="btn btn--secondary menu-quit">Quit to menu</button>
        </div>
        <div class="settings">
          <label class="setting-row"><span>Show rule violations</span>
            <button class="toggle" data-setting="violations" aria-label="Toggle violations"><span class="knob"></span></button></label>
          <label class="setting-row"><span>Sound</span>
            <button class="toggle" data-setting="sound" aria-label="Toggle sound"><span class="knob"></span></button></label>
          <label class="setting-row"><span>Haptics</span>
            <button class="toggle" data-setting="haptics" aria-label="Toggle haptics"><span class="knob"></span></button></label>
        </div>
      </div>
    </div>

    <!-- WIN (placeholder — full animation lands in Step 6) -->
    <div id="win-overlay" class="overlay">
      <div class="win-panel">
        <div class="win-tier">Crowded</div>
        <div class="win-label">solved</div>
        <div class="win-time">0:00</div>
        <div class="win-extra"></div>
        <div class="win-actions">
          <button class="btn btn--primary win-again">Play again</button>
          <button class="btn btn--secondary win-share">Share</button>
          <button class="btn btn--secondary win-menu">Menu</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Plain <script> tags share one top-level scope: load in dependency order, and
       never re-declare a name another file already declares (see js/board.js). -->
  <script src="js/rules.js"></script>
  <script src="js/board.js"></script>
  <script src="js/solver.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
